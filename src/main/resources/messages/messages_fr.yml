LIARKIT_BTN_GHOST_JOIN: "Connexion fantôme|§e► Sur toi-même (vu par les autres).|Fait croire à ta connexion : un faux message de connexion est diffusé et un faux joueur portant ton pseudo apparaît dans le TAB.|Il se « déconnecte » tout seul au bout de %duration%, sauf si tu renouvelles l'action.|Prix : %price%|Ton solde : %balance%"
LIARKIT_BTN_SILENCE: "Silence|§e► Sur toi-même.|Coupe TOUS les bruits que tu causes (pas, blocs, dégâts...) : pendant l'effet, les autres joueurs ne t'entendent plus.|Durée : %duration%|Prix : %price%|Ton solde : %balance%"
LIARKIT_BTN_PIGS: "Cochons en Creepers|§e► Sur un AUTRE joueur.|Écris dans le chat le pseudo d'un joueur : pendant l'effet, ce joueur voit tous les cochons comme des creepers (illusion purement visuelle).|Durée : %duration%|Prix : %price%|Ton solde : %balance%"
LIARKIT_BTN_GHOST: "Fantôme (invisibilité)|§e► Sur toi-même.|Te rend totalement invisible : les autres ne te voient plus et tu disparais de la liste des joueurs, comme si tu t'étais déconnecté.|Durée : %duration%|Prix : %price%|Ton solde : %balance%"
