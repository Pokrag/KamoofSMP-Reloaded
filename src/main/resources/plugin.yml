name: KamoofSMP
authors: [ Ghosty, Solmey ]
version: ${version}
api-version: 1.20
description: Reproduction du KamoofSMP Saison 2 de Sohran (portage Paper 26.3 - KamoofSMP Reloaded)
website: https://github.com/Pokrag/KamoofSMP-Reloaded
main: im.ghosty.kamoof.KamoofPlugin
softdepend: [ Essentials, SkinsRestorer ]
commands:
  kamoofsmp:
    description: Commande globale du KamoofSMP
    aliases: [ kamoof, camouf, camoufsmp ]
  givehead:
    description: Se donner n'importe quelle tête
    permission: kamoofsmp.admin
  myhead:
    description: Obtenir sa propre tête
    permission: kamoofsmp.head
  undisguise:
    description: Retirer son déguisement
permissions:
  kamoofsmp.admin:
    description: Administrateur du serveur
  kamoofsmp.head:
    description: Permet d'obtenir sa propre tête avec /myhead
    default: op